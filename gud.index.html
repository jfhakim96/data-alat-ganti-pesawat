    <div class="flex gap-2 pt-2">
     <button id="edit-save" class="flex-1 bg-emerald-600 text-white rounded-lg p-2 font-semibold text-sm">Simpan</button> <button id="edit-cancel" class="flex-1 bg-gray-300 text-gray-900 rounded-lg p-2 text-sm">Batal</button>

  <script src="/_sdk/b8fc9aac2a1ee7fa.editing_sdk.js" integrity="sha512-0BDfjlda5WnGBb/gQP/bLynj6/01veZ9b+fYg78jNuknRGKsUHsXKtTCAOVAPQK2g457p9USMdsRyZFo8+UgRA=="></script>
  <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js" integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script>
  <script>
        let allData = [];
        let activeFilter = 'all';
        let activeTxFilter = 'all';
        let searchTerm = '';
        let editingRecord = null;
        let pieChart, barChart;

        const dataHandler = {
            onDataChanged(data) {
                allData = data;
                render();
            }
        };

        (async () => {
            const r = await window.dataSdk.init(dataHandler);
            if (!r.isOk) console.error('SDK init failed');
            lucide.createIcons();
            initCharts();
        })();

        // Form submit
        document.getElementById('parts-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('[data-template-id="submit-btn"]');
            btn.disabled = true;
            const record = {
                aircraft_type: document.getElementById('aircraft').value,
                part_no: document.getElementById('partno').value,
                part_name: document.getElementById('partname').value,
                quantity: Number(document.getElementById('qty').value),
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                transaction_type: document.getElementById('txtype').value,
                transaction_time: new Date(document.getElementById('txtime').value).toISOString(),
                transaction_qty: Number(document.getElementById('txqty').value),
                created_at: new Date().toISOString()
            };
            const res = await window.dataSdk.create(record);
            btn.disabled = false;
            if (res.isOk) e.target.reset();
        });

        // Slicers
        document.querySelectorAll('.slicer-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.slicer-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        // Transaction type filters
        document.querySelectorAll('.tx-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tx-filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTxFilter = btn.dataset.txFilter;
                render();
            });
        });

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase().trim();
            render();
        });

        function getFiltered() {
            let filtered = allData;
            if (activeFilter !== 'all') {
                filtered = filtered.filter(d => d.aircraft_type === activeFilter);
            }
            if (activeTxFilter !== 'all') {
                filtered = filtered.filter(d => d.transaction_type === activeTxFilter);
            }
            if (searchTerm) {
                filtered = filtered.filter(d => 
                    (d.part_no || '').toLowerCase().includes(searchTerm) ||
                    (d.part_name || '').toLowerCase().includes(searchTerm)
                );
            }
            return filtered;
        }

        function render() {
            const data = getFiltered();
            renderTable(data);
            renderCards(data);
            renderCharts(data);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const empty = document.getElementById('empty-table');
            empty.style.display = data.length ? 'none' : 'block';
            tbody.innerHTML = '';
            data.forEach(rec => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-200 hover:bg-gray-50';
                const time = rec.transaction_time ? new Date(rec.transaction_time).toLocaleString('ms-MY', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                tr.innerHTML = `
                    <td class="py-2 px-2">${esc(rec.aircraft_type)}</td>
                    <td class="py-2 px-2 font-mono">${esc(rec.part_no)}</td>
                    <td class="py-2 px-2">${esc(rec.part_name)}</td>
                    <td class="py-2 px-2">${rec.quantity}</td>
                    <td class="py-2 px-2">${esc(rec.location)}</td>
                    <td class="py-2 px-2"><span class="px-2 py-0.5 rounded text-xs ${rec.category === 'Komponen' ? 'bg-blue-900/50 text-blue-300' : 'bg-amber-900/50 text-amber-300'}">${esc(rec.category)}</span></td>
                    <td class="py-2 px-2"><span class="${rec.transaction_type === 'Penerimaan' ? 'text-emerald-400' : 'text-red-400'}">${esc(rec.transaction_type)}</span></td>
                    <td class="py-2 px-2">${time}</td>
                    <td class="py-2 px-2">${rec.transaction_qty}</td>
                    <td class="py-2 px-2 flex gap-1">
                        <button class="edit-btn p-1 hover:text-emerald-400" title="Edit"><i data-lucide="edit" style="width:14px;height:14px"></i></button>
                        <button class="del-btn p-1 hover:text-red-400" title="Padam"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
                    </td>`;
                tr.querySelector('.edit-btn').addEventListener('click', () => openEdit(rec));
                tr.querySelector('.del-btn').addEventListener('click', async () => {
                    const res = await window.dataSdk.delete(rec);
                });
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function renderCards(data) {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            let daily = 0, weekly = 0, monthly = 0;
            data.forEach(r => {
                const t = new Date(r.transaction_time || r.created_at);
                const q = Number(r.transaction_qty) || 0;
                if (t >= startOfDay) daily += q;
                if (t >= startOfWeek) weekly += q;
                if (t >= startOfMonth) monthly += q;
            });
            document.getElementById('daily-count').textContent = daily;
            document.getElementById('weekly-count').textContent = weekly;
            document.getElementById('monthly-count').textContent = monthly;
        }

        function initCharts() {
            const ctx1 = document.getElementById('pieChart').getContext('2d');
            pieChart = new Chart(ctx1, { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: ['#f59e0b','#3b82f6','#10b981','#8b5cf6','#ef4444'] }] }, options: { plugins: { legend: { labels: { color: '#cbd5e1' } } } } });
            const ctx2 = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(ctx2, { type: 'bar', data: { labels: ['Pengeluaran', 'Penerimaan'], datasets: [{ label: 'Transaksi', data: [0, 0], backgroundColor: ['#ef4444','#10b981'] }] }, options: { plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' }, beginAtZero: true } } } });
        }

        function renderCharts(data) {
            const aircrafts = ['Hawk','C130H','A400','PC7','CN235'];
            const counts = aircrafts.map(a => data.filter(d => d.aircraft_type === a).length);
            pieChart.data.labels = aircrafts;
            pieChart.data.datasets[0].data = counts;
            pieChart.update();
            const out = data.filter(d => d.transaction_type === 'Pengeluaran').reduce((s, r) => s + (Number(r.transaction_qty) || 0), 0);
            const inp = data.filter(d => d.transaction_type === 'Penerimaan').reduce((s, r) => s + (Number(r.transaction_qty) || 0), 0);
            barChart.data.datasets[0].data = [out, inp];
            barChart.update();
        }

        // Edit modal
        function openEdit(rec) {
            editingRecord = rec;
            document.getElementById('edit-partno').value = rec.part_no;
            document.getElementById('edit-partname').value = rec.part_name;
            document.getElementById('edit-qty').value = rec.quantity;
            document.getElementById('edit-location').value = rec.location;
            document.getElementById('edit-txqty').value = rec.transaction_qty;
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        document.getElementById('edit-cancel').addEventListener('click', () => document.getElementById('edit-modal').classList.add('hidden'));
        document.getElementById('edit-save').addEventListener('click', async () => {
            if (!editingRecord) return;
            const updated = { ...editingRecord, part_no: document.getElementById('edit-partno').value, part_name: document.getElementById('edit-partname').value, quantity: Number(document.getElementById('edit-qty').value), location: document.getElementById('edit-location').value, transaction_qty: Number(document.getElementById('edit-txqty').value) };
            await window.dataSdk.update(updated);
            document.getElementById('edit-modal').classList.add('hidden');
        });

        function esc(s) { const d = document.createElement('span'); d.textContent = s || ''; return d.innerHTML; }
    </script>
